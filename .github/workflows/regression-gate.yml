name: Regression Gate
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      base:
        description: Full base commit SHA (required for callers outside pull_request)
        type: string
        default: ''
      suite:
        type: string
        default: ''
      adapter:
        type: string
        default: ''
      mode:
        description: Explicit execute or evidence
        type: string
        default: ''
      run-directory:
        description: Checkout-relative path containing {revision} as a directory component
        type: string
        default: ''
      baseline:
        type: string
        default: ''
      policy:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml jsonschema
      - name: Admit tested revision
        env:
          ci_base: ${{ inputs.base || github.event.pull_request.base.sha }}
          ci_revision: ${{ github.sha }}
          ci_suite: ${{ inputs.suite || vars.APASTRA_CI_SUITE }}
          ci_adapter: ${{ inputs.adapter || vars.APASTRA_CI_ADAPTER }}
          ci_mode: ${{ inputs.mode || vars.APASTRA_CI_MODE }}
          ci_run_directory: ${{ inputs.run-directory || vars.APASTRA_CI_RUN_DIRECTORY }}
          ci_baseline: ${{ inputs.baseline || vars.APASTRA_CI_BASELINE }}
          ci_policy: ${{ inputs.policy || vars.APASTRA_CI_POLICY }}
        run: |
          if [ -f .agent/bin/apastra ]; then
            cli=.agent/bin/apastra
          else
            cli=bin/apastra
          fi
          python3 "$cli" ci-workflow gate \
            --base "$ci_base" --revision "$ci_revision" \
            --suite "$ci_suite" --adapter "$ci_adapter" --mode "$ci_mode" \
            --run-dir "$ci_run_directory" --baseline "$ci_baseline" --policy "$ci_policy"
