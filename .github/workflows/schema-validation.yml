name: Schema Validation
on:
  pull_request:
    paths:
      - 'promptops/**'
      - 'derived-index/baselines/**'
      - '.agent/**'
      - 'scripts/**'
      - 'setup'
      - 'postinstall.sh'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'requirements*.txt'
      - 'requirements*.in'
      - 'Pipfile*'
      - 'Dockerfile'
      - 'Makefile'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.python-version'
      - 'package*.json'
      - '*-lock.*'
      - '*.lock'
      - '.github/workflows/schema-validation.yml'
      - 'bin/**'
permissions:
  contents: read
jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml jsonschema
      - name: Validate changed assets
        env:
          ci_base: ${{ github.event.pull_request.base.sha }}
          ci_revision: ${{ github.sha }}
        run: |
          if [ -f .agent/bin/apastra ]; then
            cli=.agent/bin/apastra
          else
            cli=bin/apastra
          fi
          python3 "$cli" ci-workflow validate-assets --base "$ci_base" --revision "$ci_revision"
