id: apastra-harness-artifact-contract-judge-v1
type: judge
metrics:
  - harness_artifact_contract_coverage
description: Versioned rubric for BYO harness artifact contract reviews. Scores whether a run artifact set satisfies Apastra's file-based execution contract.
metric_versions:
  harness_artifact_contract_coverage: "1.0.0"
config:
  model: default
  rubric_version: "2026-06-24"
  rubric: |
    Score harness_artifact_contract_coverage from 0.0 to 1.0.
    Award full credit only when the output:
    - verifies run_manifest.json, scorecard.json, cases.jsonl, artifact_refs.json, and failures.json when failures occurred;
    - checks reproducible revision or prompt package digests;
    - checks harness identifier, harness version, model IDs, sampling config, timestamps, environment metadata, and status;
    - treats harness identity as distinct from model identity;
    - checks stable case IDs, per-trial outputs, evaluation outputs, and raw artifact pointers;
    - checks trace/log/text artifact_refs URIs and digests;
    - preserves the BYO compute, vendor-agnostic contract.
