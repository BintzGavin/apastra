id: apastra-local-first-eval-lifecycle-judge-v1
type: judge
metrics:
  - local_first_lifecycle_readiness
description: Scores whether a local-first Apastra eval run has trustworthy source state, artifacts, policy gates, and baseline handling.
config:
  model: default
  rubric_version: "2026-06-24"
  rubric: |
    Score local_first_lifecycle_readiness from 0.0 to 1.0.
    Award full credit only when the output:
    - verifies prompt, dataset, evaluator, and suite source assets are present in Git;
    - verifies required run artifacts and useful trace references;
    - applies thresholds, cost budgets, and policy gates independently;
    - refuses to baseline failing scorecards;
    - flags hidden dashboard-only state as blocked or untrusted evidence.
metric_definitions:
  local_first_lifecycle_readiness:
    version: "1.0.0"
    direction: higher_is_better
    unit: ratio
