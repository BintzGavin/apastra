id: apastra-doc-protocol-drift-judge-v1
type: judge
metrics:
  - protocol_alignment
description: Scores whether an output correctly identifies app-level drift between Apastra docs, schemas, validators, and runtime behavior.
metric_versions:
  protocol_alignment: "1.0.0"
config:
  model: default
  rubric_version: "2026-06-24"
  rubric: |
    Score protocol_alignment from 0.0 to 1.0.
    Award full credit only when the output:
    - distinguishes documented behavior from runtime behavior;
    - names the user impact of the drift;
    - identifies a credible source of truth or reconciliation path;
    - recommends a concrete docs, schema, validator, or runtime patch;
    - turns the observed failure into a regression case.
